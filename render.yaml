services:
  - type: web
    name: kanban-backend
    runtime: docker
    rootDir: backend
    region: oregon
    plan: free
    healthCheckPath: /api/v1/lists
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CORS_ALLOWED_ORIGINS
        value: https://kanban-frontend-cyrm.onrender.com

  - type: web
    name: kanban-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kanban-backend.onrender.com/api/v1
