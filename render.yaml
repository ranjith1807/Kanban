services:
  - type: web
    name: kanban-backend
    runtime: docker
    rootDir: backend
    region: oregon
    plan: free
    healthCheckPath: /api/v1/lists
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: kanban-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: kanban-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: kanban-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://kanban-frontend.onrender.com

  - type: web
    name: kanban-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kanban-backend.onrender.com/api/v1

databases:
  - name: kanban-db
    databaseName: kanban
    user: kanban
    region: oregon
    plan: free
